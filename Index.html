<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="配色">
<meta name="theme-color" content="#fafaf9">
<title>配色辞典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fafaf9;
  --p2: #f3f2ef;
  --p3: #eceae6;
  --rule: #e4e1db;
  --rule2: #cdc9c1;
  --ink: #1c1a18;
  --ink2: #6b6760;
  --ink3: #a8a39b;
  --ink4: #cec9c1;
  --heart: #c0392b;
  --st: env(safe-area-inset-top, 44px);
  --sb: env(safe-area-inset-bottom, 34px);
  --nh: 54px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
.app { display:flex; flex-direction:column; height:100vh; height:100dvh; }

/* ── TOPBAR ── */
.topbar {
  flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding: calc(var(--st) + 6px) 20px 10px;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.topbar-left {
  display:flex; align-items:baseline; gap:8px;
}
.topbar-jp {
  font-family:'Noto Serif JP',serif;
  font-size:11px; font-weight:300;
  color:var(--ink3); letter-spacing:.3em;
}
.topbar-sep { font-size:11px; color:var(--ink4); }
.topbar-en {
  font-family:'Noto Serif JP',serif;
  font-size:15px; font-weight:300;
  color:var(--ink); letter-spacing:.04em;
}
.topbar-meta {
  font-size:10px; font-weight:300;
  color:var(--ink4); letter-spacing:.04em;
}

/* ── PAGES ── */
.pages { flex:1; overflow:hidden; position:relative; }
.page {
  display:none; height:100%;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--paper);
  padding-bottom: calc(var(--sb) + var(--nh) + 8px);
}
.page.active { display:block; }
#pg-scan { padding-bottom:0; display:none; flex-direction:column; }
#pg-scan.active { display:flex; }

/* ── NAV ── */
.nav {
  flex-shrink:0; display:flex;
  background:var(--paper); border-top:1px solid var(--rule);
  padding-bottom:var(--sb);
  height: calc(var(--nh) + var(--sb));
}
.nb {
  flex:1; display:flex; flex-direction:column; align-items:center;
  gap:3px; padding:9px 4px 6px; cursor:pointer;
  color:var(--ink4); border:none; background:none;
  transition:color .18s; font-family:'DM Sans',sans-serif;
}
.nb.active { color:var(--ink); }
.nb-ic { font-size:17px; line-height:1; }
.nb-lb { font-size:8px; font-weight:500; letter-spacing:.13em; text-transform:uppercase; }

/* ── FILTER STRIPS ── */
.frow { display:flex; gap:6px; padding:13px 18px 0; overflow-x:auto; scrollbar-width:none; }
.frow::-webkit-scrollbar { display:none; }
.frow + .frow { padding-top:7px; }
.fp {
  flex-shrink:0; padding:5px 12px; border-radius:100px;
  font-size:11px; font-weight:400;
  border:1px solid var(--rule2); color:var(--ink2);
  background:var(--paper); cursor:pointer; transition:all .14s; white-space:nowrap;
}
.fp.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* ── COUNT BAR ── */
.cbar { padding:12px 18px 8px; }
.cbar-txt { font-size:11px; font-weight:300; color:var(--ink3); letter-spacing:.03em; }
.cbar-txt b { font-weight:500; color:var(--ink); }

/* ── SCROLL TOP ── */
.stbtn {
  position:fixed; bottom:calc(var(--sb)+var(--nh)+14px); right:16px;
  width:36px; height:36px;
  background:var(--ink); color:var(--paper);
  border:none; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; cursor:pointer; z-index:100;
  box-shadow:0 2px 10px rgba(28,26,24,.18);
  opacity:0; pointer-events:none; transition:opacity .22s;
}
.stbtn.vis { opacity:1; pointer-events:all; }

/* ── SECTION LABEL ── */
.slbl { font-size:10px; font-weight:500; letter-spacing:.15em; text-transform:uppercase; color:var(--ink3); padding:16px 18px 10px; }

/* ── COMBO CARDS ── */
.combo-list { padding:0 18px; }
.cc {
  background:var(--paper); border:1px solid var(--rule);
  border-radius:14px; margin-bottom:10px; overflow:hidden;
  animation:rise .22s ease both;
}
@keyframes rise { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.cc-swatches { display:flex; height:78px; }
.cc-sw { flex:1; }
.cc-foot { display:flex; align-items:center; justify-content:space-between; padding:9px 13px; gap:8px; }
.cc-left { display:flex; flex-direction:column; gap:2px; }
.cc-palnum { font-size:11px; font-weight:500; color:var(--ink); }
.cc-colcnt { font-size:10px; font-weight:300; color:var(--ink3); }
.cc-right { display:flex; align-items:center; gap:8px; }
.hbtn { background:none; border:none; font-size:19px; cursor:pointer; color:var(--ink4); line-height:1; padding:2px; transition:color .12s; }
.hbtn.on { color:var(--heart); }
.dbtn {
  background:var(--p2); border:1px solid var(--rule2); color:var(--ink2);
  font-family:'DM Sans',sans-serif; font-size:10px; font-weight:500;
  letter-spacing:.04em; padding:6px 12px; border-radius:7px;
  cursor:pointer; transition:all .12s; white-space:nowrap;
}
.dbtn:active { background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* ── DETAIL VIEW ── */
.dview { display:none; position:fixed; inset:0; background:var(--paper); z-index:500; flex-direction:column; }
.dview.on { display:flex; }
.dv-top {
  flex-shrink:0;
  padding:calc(var(--st)+8px) 18px 11px;
  border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:12px;
}
.dv-back {
  background:none; border:none; color:var(--ink2);
  font-family:'DM Sans',sans-serif; font-size:13px; font-weight:400;
  cursor:pointer; padding:0; flex-shrink:0; transition:color .12s;
  display:flex; align-items:center; gap:3px;
}
.dv-back:active { color:var(--ink); }
.dv-title {
  font-family:'Noto Serif JP',serif; font-size:16px; font-weight:300;
  color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dv-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(var(--sb)+20px); }

/* big strip */
.big-strip { display:flex; height:140px; width:100%; }
.big-sw { flex:1; min-width:0; }

/* color rows in combo detail */
.dc-list { padding:14px 18px; display:flex; flex-direction:column; gap:9px; }
.dc-row {
  display:flex; align-items:stretch;
  background:var(--paper); border:1px solid var(--rule);
  border-radius:12px; overflow:hidden;
}
.dc-sq { width:56px; min-width:56px; flex-shrink:0; }
.dc-body { flex:1; padding:9px 10px; min-width:0; }
.dc-name { font-size:12px; font-weight:400; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dc-hexv { font-size:10px; font-weight:300; color:var(--ink3); margin-top:2px; letter-spacing:.05em; }
.dc-btns { display:flex; flex-direction:column; gap:3px; padding:9px 11px 9px 0; justify-content:center; flex-shrink:0; }
.cpb {
  background:var(--p2); border:1px solid var(--rule2); color:var(--ink2);
  font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700;
  letter-spacing:.09em; padding:4px 8px; border-radius:5px;
  cursor:pointer; transition:all .1s; white-space:nowrap;
}
.cpb:active { background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* ── COLORS PAGE ── */
.csw { padding:11px 18px 0; position:relative; }
.csi {
  width:100%; background:var(--p2); border:1px solid var(--rule);
  color:var(--ink); font-family:'DM Sans',sans-serif; font-size:13px;
  font-weight:300; padding:9px 13px 9px 36px; border-radius:10px;
  outline:none; transition:border-color .15s;
}
.csi:focus { border-color:var(--ink); background:var(--paper); }
.csi::placeholder { color:var(--ink4); }
.csico { position:absolute; left:31px; top:50%; transform:translateY(-50%); color:var(--ink3); font-size:14px; pointer-events:none; }

/* color grid */
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:10px 18px; }
.cblk {
  position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden;
  cursor:pointer; transition:transform .12s;
}
.cblk:active { transform:scale(.95); }
.cblk-bg { position:absolute; inset:0; }
.cblk-foot {
  position:absolute; bottom:0; left:0; right:0;
  background:rgba(250,250,249,.94);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  padding:7px 9px;
  display:flex; align-items:center; justify-content:space-between;
}
.cblk-name { font-size:10px; font-weight:400; color:var(--ink); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cblk-arr { font-size:10px; color:var(--ink3); flex-shrink:0; margin-left:3px; }

/* ── COLOR DETAIL ── */
.cd-hero { position:relative; overflow:hidden; flex-shrink:0; height:200px; }
.cd-hero-bg { position:absolute; inset:0; }
.cd-hero-info {
  position:absolute; bottom:0; left:0; right:0;
  background:rgba(250,250,249,.93);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  padding:12px 18px;
}
.cd-idx { font-size:9px; font-weight:500; letter-spacing:.22em; color:var(--ink3); text-transform:uppercase; margin-bottom:3px; }
.cd-cname { font-family:'Noto Serif JP',serif; font-size:22px; font-weight:300; color:var(--ink); line-height:1.15; }

/* code buttons — fixed width, no overflow */
.cd-codes {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:6px;
  padding:14px 18px 0;
}
.cdcb {
  display:flex; flex-direction:column; gap:2px;
  background:var(--p2); border:1px solid var(--rule);
  border-radius:9px; padding:8px 10px; cursor:pointer;
  transition:all .12s; min-width:0; overflow:hidden;
}
.cdcb .cl { font-size:8px; font-weight:700; letter-spacing:.18em; color:var(--ink4); text-transform:uppercase; }
.cdcb .cv { font-size:10px; font-weight:300; color:var(--ink2); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cdcb:active { background:var(--ink); border-color:var(--ink); }
.cdcb:active .cl, .cdcb:active .cv { color:var(--paper); }

.cd-fav {
  margin:12px 18px 0; display:block; width:calc(100% - 36px);
  background:var(--paper); border:1px solid var(--rule2); color:var(--ink2);
  font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500;
  letter-spacing:.05em; padding:12px; border-radius:9px;
  cursor:pointer; transition:all .2s; text-align:center;
}
.cd-fav.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* combo mini cards in color detail */
.cd-ccl { padding:4px 18px; }
.cdcc {
  background:var(--paper); border:1px solid var(--rule);
  border-radius:11px; margin-bottom:8px; overflow:hidden;
  cursor:pointer; transition:border-color .14s; animation:rise .22s ease both;
}
.cdcc:active { border-color:var(--ink); }
.cdcc-sw { display:flex; height:50px; }
.cdcc-swc { flex:1; }
.cdcc-foot { padding:8px 11px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.cdcc-num { font-size:10px; font-weight:500; color:var(--ink3); flex-shrink:0; }
.cdcc-names { font-size:10px; font-weight:300; color:var(--ink2); flex:1; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ── SCANNER ── */
.scan-idle {
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:16px; padding:36px 30px; text-align:center;
}
.scan-idle-circle {
  width:72px; height:72px; background:var(--p2); border:1px solid var(--rule2);
  border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px;
}
.scan-idle-title { font-family:'Noto Serif JP',serif; font-size:20px; font-weight:300; color:var(--ink); }
.scan-idle-sub { font-size:13px; font-weight:300; color:var(--ink3); line-height:1.7; max-width:240px; }
.scanbtn {
  background:var(--ink); color:var(--paper); border:none;
  font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500;
  letter-spacing:.05em; padding:13px 34px; border-radius:100px; cursor:pointer;
}
.scanbtn:active { background:#333; }
.scan-err { font-size:12px; font-weight:300; color:var(--heart); text-align:center; padding:0 22px; display:none; line-height:1.6; }

.cam-live { flex:1; display:none; flex-direction:column; overflow:hidden; }
.cam-live.on { display:flex; }
.cam-vp { position:relative; width:100%; flex-shrink:0; background:#000; overflow:hidden; aspect-ratio:4/3; max-height:50vh; }
#camVid { width:100%; height:100%; object-fit:cover; display:block; }
.cam-ui { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.cam-sq { width:68px; height:68px; position:relative; }
.cam-sq-c { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:5px; height:5px; background:rgba(255,255,255,.85); border-radius:50%; }
.c-tl { position:absolute; top:0; left:0; width:13px; height:13px; border-top:2px solid white; border-left:2px solid white; }
.c-tr { position:absolute; top:0; right:0; width:13px; height:13px; border-top:2px solid white; border-right:2px solid white; }
.c-bl { position:absolute; bottom:0; left:0; width:13px; height:13px; border-bottom:2px solid white; border-left:2px solid white; }
.c-br { position:absolute; bottom:0; right:0; width:13px; height:13px; border-bottom:2px solid white; border-right:2px solid white; }
.cam-pill {
  position:absolute; bottom:12px; left:12px;
  display:flex; align-items:center; gap:7px;
  background:rgba(250,250,249,.92); backdrop-filter:blur(10px);
  border-radius:100px; padding:5px 12px 5px 6px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.cam-pdot { width:20px; height:20px; border-radius:50%; border:1.5px solid var(--rule2); flex-shrink:0; }
.cam-phex { font-size:11px; font-weight:500; color:var(--ink); letter-spacing:.05em; }
.cam-matchbtn {
  position:absolute; bottom:12px; right:12px;
  background:var(--ink); color:var(--paper); border:none;
  font-family:'DM Sans',sans-serif; font-size:11px; font-weight:600;
  letter-spacing:.07em; text-transform:uppercase; padding:9px 16px;
  border-radius:100px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.cam-matchbtn:active { background:#333; }
.scan-result { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 18px calc(var(--sb)+16px); }
.smt {
  display:flex; align-items:center; gap:12px;
  background:var(--p2); border:1px solid var(--rule);
  border-radius:14px; padding:12px; margin-bottom:14px;
}
.smt-sw { width:56px; height:56px; border-radius:9px; flex-shrink:0; }
.smt-info { flex:1; min-width:0; }
.smt-lbl { font-size:9px; font-weight:600; letter-spacing:.18em; color:var(--ink3); text-transform:uppercase; margin-bottom:3px; }
.smt-name { font-family:'Noto Serif JP',serif; font-size:16px; font-weight:300; color:var(--ink); line-height:1.2; }
.smt-hex { font-size:10px; font-weight:300; color:var(--ink3); margin-top:2px; letter-spacing:.05em; }
.scan-comp { display:flex; align-items:center; gap:9px; margin-bottom:14px; }
.scd { width:32px; height:32px; border-radius:50%; border:1.5px solid var(--rule); flex-shrink:0; }
.sca { font-size:12px; color:var(--ink4); }
.sci { flex:1; }
.scil { font-size:9px; font-weight:600; letter-spacing:.16em; color:var(--ink3); text-transform:uppercase; }
.sciv { font-size:12px; font-weight:400; color:var(--ink); margin-top:2px; }

/* scan code row — same grid */
.scan-codes {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:6px; margin-bottom:14px;
}

/* ── FAVORITES ── */
.no-favs { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:50vh; gap:14px; padding:40px 30px; text-align:center; }
.nfc { width:68px; height:68px; background:var(--p2); border:1px solid var(--rule); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; }
.nft { font-family:'Noto Serif JP',serif; font-size:19px; font-weight:300; color:var(--ink); }
.nfs { font-size:13px; font-weight:300; color:var(--ink3); line-height:1.7; max-width:220px; }
.fav-cg { display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:0 18px 14px; }
.fav-blk { position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .12s; animation:rise .22s ease both; }
.fav-blk:active { transform:scale(.95); }
.fav-bg { position:absolute; inset:0; }
.fav-foot { position:absolute; bottom:0; left:0; right:0; background:rgba(250,250,249,.93); backdrop-filter:blur(10px); padding:7px 9px; }
.fav-fn { font-size:10px; font-weight:400; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fav-fh { font-size:9px; font-weight:300; color:var(--ink3); letter-spacing:.05em; margin-top:1px; }
.fav-rm { position:absolute; top:7px; right:7px; width:24px; height:24px; background:rgba(250,250,249,.88); backdrop-filter:blur(6px); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink3); cursor:pointer; }
.fav-rm:active { color:var(--heart); }
.fav-pl { padding:0 18px 14px; display:flex; flex-direction:column; gap:8px; }
.fav-pc { background:var(--paper); border:1px solid var(--rule); border-radius:11px; overflow:hidden; animation:rise .22s ease both; }
.fav-psw { display:flex; height:56px; }
.fav-pswc { flex:1; }
.fav-pfoot { padding:8px 11px; display:flex; align-items:center; justify-content:space-between; }
.fav-pnum { font-size:10px; font-weight:500; color:var(--ink2); cursor:pointer; }
.fav-prm { font-size:15px; color:var(--ink4); cursor:pointer; padding:2px; }
.fav-prm:active { color:var(--heart); }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:calc(var(--sb)+var(--nh)+14px); left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); font-size:11px; font-weight:500;
  letter-spacing:.09em; padding:8px 18px; border-radius:100px;
  pointer-events:none; opacity:0; transition:opacity .18s; z-index:999; white-space:nowrap;
}
.toast.show { opacity:1; }
::-webkit-scrollbar { width:2px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--rule2); }
#snapC { display:none; }
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR: minimal one-liner -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-jp">配色辞典</span>
      <span class="topbar-sep">·</span>
      <span class="topbar-en">Wada Colors</span>
    </div>
    <span class="topbar-meta">157 colors · 348 palettes</span>
  </div>

  <!-- PAGES -->
  <div class="pages">

    <!-- COMBOS -->
    <div class="page active" id="pg-combos">
      <div class="frow" id="frow-cnt"></div>
      <div class="frow" id="frow-fam"></div>
      <div class="cbar"><span class="cbar-txt" id="combo-lbl">— combinations</span></div>
      <div class="combo-list" id="combo-list"></div>
    </div>

    <!-- COLORS -->
    <div class="page" id="pg-colors">
      <div class="frow" id="cfrow"></div>
      <div class="csw">
        <span class="csico">⌕</span>
        <input class="csi" id="csi" type="search" placeholder="Name or hex…" autocomplete="off">
      </div>
      <div class="cbar"><span class="cbar-txt" id="colors-lbl">— colors</span></div>
      <div class="cgrid" id="cgrid"></div>
    </div>

    <!-- SCAN -->
    <div class="page" id="pg-scan">
      <div class="scan-idle" id="scan-idle">
        <div class="scan-idle-circle">📷</div>
        <div class="scan-idle-title">Color Scanner</div>
        <div class="scan-idle-sub">Point at any fabric or garment. We'll find the closest Wada color and show all its palette combinations.</div>
        <button class="scanbtn" onclick="startCam()">Open Camera</button>
        <div class="scan-err" id="scan-err">Camera unavailable. Allow access in Safari settings.</div>
      </div>
      <div class="cam-live" id="cam-live">
        <div class="cam-vp">
          <video id="camVid" autoplay playsinline muted></video>
          <div class="cam-ui">
            <div class="cam-sq">

const CM={};C.forEach(c=>CM[c.i]=c);
const PM={};C.forEach(c=>c.p.forEach(p=>{if(!PM[p])PM[p]=[];PM[p].push(c)}));
const ALL_PAL=Object.keys(PM).sort((a,b)=>+a-+b).map(k=>({n:+k,c:PM[k]}));

function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h,s,l=(mx+mn)/2;if(mx===mn){h=s=0}else{const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}}return[h*360,s,l]}
function fam(c){const[r,g,b]=c.r,[h,s,l]=hsl(r,g,b);if(l<.09)return'Darks';if(l>.88&&s<.15)return'Whites';if(s<.13)return'Grays';if(h<20||h>=340)return'Reds';if(h<45)return'Oranges';if(h<70)return'Yellows';if(h<150)return'Greens';if(h<200)return'Teals';if(h<255)return'Blues';if(h<290)return'Purples';return'Pinks'}
const FAM_ORDER=['Reds','Oranges','Yellows','Greens','Teals','Blues','Purples','Pinks','Whites','Grays','Darks'];

// Multi-select family filter for combos
let favs=JSON.parse(localStorage.getItem('wada5_f')||'[]');
let cf_cnt=0, cf_fams=new Set(), col_fam='All', col_q='';
let camStream=null, sampI=null;
function saveFavs(){localStorage.setItem('wada5_f',JSON.stringify(favs))}

function lab(r,g,b){let R=r/255,G=g/255,B=b/255;R=R>.04045?((R+.055)/1.055)**2.4:R/12.92;G=G>.04045?((G+.055)/1.055)**2.4:G/12.92;B=B>.04045?((B+.055)/1.055)**2.4:B/12.92;let X=(R*.4124+G*.3576+B*.1805)/.95047,Y=R*.2126+G*.7152+B*.0722,Z=(R*.0193+G*.1192+B*.9505)/1.08883;const f=t=>t>.008856?t**(1/3):7.787*t+16/116;return[+(116*f(Y)-16).toFixed(1),+(500*(f(X)-f(Y))).toFixed(1),+(200*(f(Y)-f(Z))).toFixed(1)]}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function cp(v){navigator.clipboard?.writeText(String(v)).then(()=>toast('Copied'))}
function cdist(r1,g1,b1,r2,g2,b2){const rm=(r1+r2)/2,dr=r1-r2,dg=g1-g2,db=b1-b2;return Math.sqrt((2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db)}

/* ── COMBOS ── */
function buildCF(){
  // row 1: count (single select)
  document.getElementById('frow-cnt').innerHTML=
    [{v:0,l:'All'},{v:2,l:'2 Colors'},{v:3,l:'3 Colors'},{v:4,l:'4 Colors'},{v:5,l:'5+ Colors'}]
    .map(o=>`<div class="fp ${o.v===cf_cnt?'on':''}" onclick="setCnt(${o.v})">${o.l}</div>`).join('');
  // row 2: family (multi-select — tap to toggle, can pick multiple)
  document.getElementById('frow-fam').innerHTML=
    FAM_ORDER.map(f=>`<div class="fp ${cf_fams.has(f)?'on':''}" onclick="togFam('${f}')">${f}</div>`).join('');
}
function setCnt(v){cf_cnt=v;buildCF();renderCombos()}
function togFam(f){
  if(cf_fams.has(f))cf_fams.delete(f);
  else cf_fams.add(f);
  buildCF();renderCombos();
}
function renderCombos(){
  let p=[...ALL_PAL];
  if(cf_cnt===2)p=p.filter(x=>x.c.length===2);
  else if(cf_cnt===3)p=p.filter(x=>x.c.length===3);
  else if(cf_cnt===4)p=p.filter(x=>x.c.length===4);
  else if(cf_cnt===5)p=p.filter(x=>x.c.length>=5);
  // multi-family filter: palette must contain AT LEAST ONE color from EACH selected family
  if(cf_fams.size>0){
    p=p.filter(x=>{
      const palFams=new Set(x.c.map(c=>fam(c)));
      for(const f of cf_fams){if(!palFams.has(f))return false}
      return true;
    });
  }
  const famLabel=cf_fams.size>0?' · '+[...cf_fams].join(' + '):'';
  document.getElementById('combo-lbl').innerHTML=`<b>${p.length}</b> combination${p.length!==1?'s':''}${famLabel}`;
  document.getElementById('combo-list').innerHTML=p.map((x,i)=>`
    <div class="cc" style="animation-delay:${Math.min(i,20)*.022}s">
      <div class="cc-swatches">${x.c.map(c=>`<div class="cc-sw" style="background:${c.h}"></div>`).join('')}</div>
      <div class="cc-foot">
        <div class="cc-left">
          <span class="cc-palnum">Palette No. ${x.n}</span>
          <span class="cc-colcnt">${x.c.length} color${x.c.length!==1?'s':''}</span>
        </div>
        <div class="cc-right">
          <button class="hbtn ${favs.includes('p'+x.n)?'on':''}" onclick="togPF(${x.n},this)">${favs.includes('p'+x.n)?'♥':'♡'}</button>
          <button class="dbtn" onclick="openComboDV(${x.n})">Details ›</button>
        </div>
      </div>
    </div>
  `).join('');
}
function togPF(n,btn){const k='p'+n;if(favs.includes(k)){favs=favs.filter(x=>x!==k);btn.textContent='♡';btn.classList.remove('on')}else{favs.unshift(k);btn.textContent='♥';btn.classList.add('on')}saveFavs();if(document.getElementById('pg-favs').classList.contains('active'))renderFavs()}
function openComboDV(n){
  const cols=PM[n]||[];
  document.getElementById('dv-combo-title').textContent='Palette No. '+n;
  document.getElementById('dv-combo-scroll').innerHTML=
    `<div class="big-strip">${cols.map(c=>`<div class="big-sw" style="background:${c.h}"></div>`).join('')}</div>`+
    `<div class="dc-list">${cols.map(c=>{const lb=lab(...c.r);return(
      `<div class="dc-row">`+
        `<div class="dc-sq" style="background:${c.h}"></div>`+
        `<div class="dc-body"><div class="dc-name">${c.n}</div><div class="dc-hexv">${c.h.toUpperCase()}</div></div>`+
        `<div class="dc-btns">`+
          `<button class="cpb" onclick="cp('${c.h.toUpperCase()}')">HEX</button>`+
          `<button class="cpb" onclick="cp('${c.r.join(',')}')">RGB</button>`+
          `<button class="cpb" onclick="cp('${lb.join(',')}')">LAB</button>`+
        `</div>`+
      `</div>`
    )}).join('')}</div>`;
  document.getElementById('dv-combo').classList.add('on');
}

/* ── COLORS ── */
function buildColorF(){
  document.getElementById('cfrow').innerHTML=
    ['All',...FAM_ORDER].map(f=>`<div class="fp ${f===col_fam?'on':''}" onclick="setColFam('${f}')">${f}</div>`).join('');
}
function setColFam(f){col_fam=f;buildColorF();renderColors()}
document.getElementById('csi').addEventListener('input',function(){col_q=this.value.trim();renderColors()});
function renderColors(){
  let list=[...C];
  if(col_fam!=='All')list=list.filter(c=>fam(c)===col_fam);
  if(col_q){const q=col_q.toLowerCase();list=list.filter(c=>c.n.toLowerCase().includes(q)||c.h.toLowerCase().includes(q))}
  document.getElementById('colors-lbl').innerHTML=`<b>${list.length}</b> color${list.length!==1?'s':''}`;
  document.getElementById('cgrid').innerHTML=list.map((c,i)=>`
    <div class="cblk" style="animation-delay:${Math.min(i,20)*.022}s" onclick="openColorDV(${c.i})">
      <div class="cblk-bg" style="background:${c.h}"></div>
      <div class="cblk-foot"><span class="cblk-name">${c.n}</span><span class="cblk-arr">›</span></div>
    </div>
  `).join('');
}
function openColorDV(idx){
  const c=CM[idx];const lb=lab(...c.r);const isFav=favs.includes('c'+idx);
  const pals=c.p.map(n=>({n,c:PM[n]||[]})).filter(p=>p.c.length>0);
  document.getElementById('dv-color-title').textContent='No. '+String(idx).padStart(3,'0')+' · '+c.n;
  document.getElementById('dv-color-scroll').innerHTML=
    `<div class="cd-hero"><div class="cd-hero-bg" style="background:${c.h}"></div>`+
    `<div class="cd-hero-info"><div class="cd-idx">No. ${String(idx).padStart(3,'0')}</div><div class="cd-cname">${c.n}</div></div></div>`+
    `<div class="cd-codes">`+
      `<button class="cdcb" onclick="cp('${c.h.toUpperCase()}')"><span class="cl">HEX</span><span class="cv">${c.h.toUpperCase()}</span></button>`+
      `<button class="cdcb" onclick="cp('${c.r.join(',')}')"><span class="cl">RGB</span><span class="cv">${c.r.join(', ')}</span></button>`+
      `<button class="cdcb" onclick="cp('${lb.join(',')}')"><span class="cl">LAB</span><span class="cv">${lb.join(', ')}</span></button>`+
      `<button class="cdcb" onclick="cp('${c.k.join(',')}')"><span class="cl">CMYK</span><span class="cv">${c.k.join(', ')}</span></button>`+
    `</div>`+
    `<button class="cd-fav ${isFav?'on':''}" id="cdfb" onclick="togCF(${idx})">${isFav?'♥  Saved':'♡  Save Color'}</button>`+
    `<div class="slbl" style="padding:18px 18px 10px">${pals.length} combination${pals.length!==1?'s':''} in the dictionary</div>`+
    `<div class="cd-ccl">${pals.map((p,i)=>`
      <div class="cdcc" style="animation-delay:${i*.03}s" onclick="closeDV('dv-color');setTimeout(()=>openComboDV(${p.n}),120)">
        <div class="cdcc-sw">${p.c.map(cl=>`<div class="cdcc-swc" style="background:${cl.h}"></div>`).join('')}</div>
        <div class="cdcc-foot"><span class="cdcc-num">Palette ${p.n}</span><span class="cdcc-names">${p.c.map(cl=>cl.n).join(' · ')}</span></div>
      </div>`).join('')}</div>`;
  document.getElementById('dv-color').classList.add('on');
}
function togCF(idx){const k='c'+idx;if(favs.includes(k))favs=favs.filter(x=>x!==k);else favs.unshift(k);saveFavs();const btn=document.getElementById('cdfb');if(btn){const on=favs.includes(k);btn.textContent=on?'♥  Saved':'♡  Save Color';btn.classList.toggle('on',on)}if(document.getElementById('pg-favs').classList.contains('active'))renderFavs()}
function closeDV(id){document.getElementById(id).classList.remove('on')}

async function startCam(){const err=document.getElementById('scan-err');try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=document.getElementById('camVid');v.srcObject=camStream;await v.play();document.getElementById('scan-idle').style.display='none';document.getElementById('cam-live').classList.add('on');document.getElementById('scan-result').innerHTML='';startSamp()}catch(e){err.style.display='block';console.error(e)}}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}clearInterval(sampI);sampI=null;document.getElementById('cam-live').classList.remove('on');document.getElementById('scan-idle').style.display='flex'}
function startSamp(){clearInterval(sampI);sampI=setInterval(()=>{const v=document.getElementById('camVid');if(v.readyState<2)return;const cv=document.getElementById('snapC'),w=v.videoWidth,h=v.videoHeight;cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.drawImage(v,0,0,w,h);const cx=~~(w/2),cy=~~(h/2),d=ctx.getImageData(cx-10,cy-10,20,20).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}const px=d.length/4;r=~~(r/px);g=~~(g/px);b=~~(b/px);const hx='#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('cam-dot').style.background=hx;document.getElementById('cam-hex').textContent=hx.toUpperCase()},150)}
function doScan(){const v=document.getElementById('camVid');if(!v||v.readyState<2)return;const cv=document.getElementById('snapC'),w=v.videoWidth,h=v.videoHeight;cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.drawImage(v,0,0,w,h);const cx=~~(w/2),cy=~~(h/2),d=ctx.getImageData(cx-25,cy-25,50,50).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}const px=d.length/4;r=~~(r/px);g=~~(g/px);b=~~(b/px);let best=null,bd=Infinity;C.forEach(c=>{const dd=cdist(r,g,b,...c.r);if(dd<bd){bd=dd;best=c}});showSR({r,g,b},best)}
function showSR(s,m){
  const sh='#'+[s.r,s.g,s.b].map(x=>x.toString(16).padStart(2,'0')).join('');
  const lb=lab(...m.r);const isFav=favs.includes('c'+m.i);
  const pals=m.p.map(n=>({n,c:PM[n]||[]})).filter(p=>p.c.length>0);
  document.getElementById('scan-result').innerHTML=
    `<div class="scan-comp"><div class="scd" style="background:${sh}"></div><div class="sca">→</div><div class="sci"><div class="scil">Closest match</div><div class="sciv">${m.n}</div></div><div class="scd" style="background:${m.h}"></div></div>`+
    `<div class="smt"><div class="smt-sw" style="background:${m.h}"></div><div class="smt-info"><div class="smt-lbl">No. ${String(m.i).padStart(3,'0')}</div><div class="smt-name">${m.n}</div><div class="smt-hex">${m.h.toUpperCase()}</div></div></div>`+
    `<div class="scan-codes">`+
      `<button class="cdcb" onclick="cp('${m.h.toUpperCase()}')"><span class="cl">HEX</span><span class="cv">${m.h.toUpperCase()}</span></button>`+
      `<button class="cdcb" onclick="cp('${m.r.join(',')}')"><span class="cl">RGB</span><span class="cv">${m.r.join(', ')}</span></button>`+
      `<button class="cdcb" onclick="cp('${lb.join(',')}')"><span class="cl">LAB</span><span class="cv">${lb.join(', ')}</span></button>`+
    `</div>`+
    `<button class="cd-fav ${isFav?'on':''}" id="sfb" onclick="togSF(${m.i})">${isFav?'♥  Saved':'♡  Save Color'}</button>`+
    `<div class="slbl" style="padding:16px 0 10px">${pals.length} combination${pals.length!==1?'s':''}</div>`+
    pals.map((p,i)=>`<div class="cdcc" style="animation-delay:${i*.03}s;margin-bottom:8px" onclick="openComboDV(${p.n})"><div class="cdcc-sw">${p.c.map(c=>`<div class="cdcc-swc" style="background:${c.h}"></div>`).join('')}</div><div class="cdcc-foot"><span class="cdcc-num">Palette ${p.n}</span><span class="cdcc-names">${p.c.map(c=>c.n).join(' · ')}</span></div></div>`).join('');
}
function togSF(idx){const k='c'+idx;if(favs.includes(k))favs=favs.filter(x=>x!==k);else favs.unshift(k);saveFavs();const btn=document.getElementById('sfb');if(btn){const on=favs.includes(k);btn.textContent=on?'♥  Saved':'♡  Save Color';btn.classList.toggle('on',on)}}

/* ── FAVORITES ── */
function renderFavs(){
  const el=document.getElementById('favs-inner');
  const cf=favs.filter(f=>f.startsWith('c')).map(f=>CM[+f.slice(1)]).filter(Boolean);
  const pf=favs.filter(f=>f.startsWith('p')).map(f=>({n:+f.slice(1),c:PM[+f.slice(1)]||[]})).filter(p=>p.c.length>0);
  if(!cf.length&&!pf.length){el.innerHTML='<div class="no-favs"><div class="nfc">♡</div><div class="nft">Nothing saved yet</div><div class="nfs">Tap ♡ on any combination or color to save it here.</div></div>';return}
  let html='';
  if(cf.length)html+=`<div class="slbl">${cf.length} saved color${cf.length!==1?'s':''}</div><div class="fav-cg">${cf.map((c,i)=>`<div class="fav-blk" style="animation-delay:${i*.03}s" onclick="openColorDV(${c.i})"><div class="fav-bg" style="background:${c.h}"></div><div class="fav-foot"><div class="fav-fn">${c.n}</div><div class="fav-fh">${c.h.toUpperCase()}</div></div><div class="fav-rm" onclick="event.stopPropagation();rmFav('c${c.i}')">✕</div></div>`).join('')}</div>`;
  if(pf.length)html+=`<div class="slbl">${pf.length} saved palette${pf.length!==1?'s':''}</div><div class="fav-pl">${pf.map((p,i)=>`<div class="fav-pc" style="animation-delay:${i*.03}s"><div class="fav-psw">${p.c.map(c=>`<div class="fav-pswc" style="background:${c.h};flex:1"></div>`).join('')}</div><div class="fav-pfoot"><span class="fav-pnum" onclick="openComboDV(${p.n})">Palette No. ${p.n} · ${p.c.length} colors</span><span class="fav-prm" onclick="rmFav('p${p.n}')">✕</span></div></div>`).join('')}</div>`;
  el.innerHTML=html;
}
function rmFav(k){favs=favs.filter(x=>x!==k);saveFavs();renderFavs()}

/* ── NAV + SCROLL ── */
function goPage(pg){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('pg-'+pg).classList.add('active');
  document.getElementById('nb-'+pg).classList.add('active');
  document.getElementById('stbtn').classList.remove('vis');
  if(pg!=='scan')stopCam();
  if(pg==='favs')renderFavs();
}
function scrollTop(){const a=document.querySelector('.page.active');if(a)a.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.page').forEach(pg=>{
  pg.addEventListener('scroll',function(){
    document.getElementById('stbtn').classList.toggle('vis',this.scrollTop>280);
  });
});

buildCF(); renderCombos(); buildColorF(); renderColors();
</script>
